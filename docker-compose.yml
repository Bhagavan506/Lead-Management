services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadbook
      POSTGRES_PASSWORD: leadbook
      POSTGRES_DB: leadbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadbook -d leadbook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
