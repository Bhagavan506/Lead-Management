# Production-shaped stack on any host that runs Docker Compose:
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm api node dist/db/migrate.js
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm \
#     -e ADMIN_NAME -e ADMIN_EMAIL -e ADMIN_PASSWORD api node dist/db/create-admin.js
# Put TLS in front of the `web` service (your host's load balancer or a reverse proxy).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: leadbook
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadbook -d leadbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://leadbook:${POSTGRES_PASSWORD}@postgres:5432/leadbook
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COOKIE_SECURE: "true"
      CORS_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL}
      TRUST_PROXY: "true"
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-IN}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-en}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
